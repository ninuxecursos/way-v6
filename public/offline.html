<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão — Way Home</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        radial-gradient(60% 50% at 80% 10%, rgba(255,25,94,0.18), transparent 60%),
        radial-gradient(60% 50% at 0% 100%, rgba(108,16,199,0.18), transparent 60%);
    }
    .card { max-width: 460px; text-align: center; }
    h1 { font-size: 28px; margin: 16px 0 8px; letter-spacing: -0.02em; }
    p  { color: #c4c4c4; line-height: 1.55; margin: 0 0 24px; }
    .dot {
      width: 64px; height: 64px; margin: 0 auto; border-radius: 999px;
      background: linear-gradient(135deg, #ff195e, #6c10c7);
      display: grid; place-items: center; box-shadow: 0 10px 40px rgba(255,25,94,0.35);
    }
    .dot svg { color: white; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(135deg, #ff195e, #6c10c7);
      color: white; font-weight: 700; padding: 12px 22px; border-radius: 999px;
      font-size: 15px;
    }
    .meta { font-size: 13px; color: #8a8a8a; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Você está offline</h1>
    <p>Não conseguimos carregar esta página. Verifique sua conexão e tente novamente — a Way Home continua aqui te esperando.</p>
    <button onclick="location.reload()">Tentar novamente</button>
    <p class="meta">Way Home · Sua casa no Tomorrowland Brasil</p>
  </main>
</body>
</html>
